# Dostawcy API LLM: metadane dla GUI (API backendu: /api/llm-providers). Silnik tego pliku nie czyta.
# Profile LLM z release.yaml są przypisywane do dostawcy po base_url.
providers:
  - code: edenai
    name: Eden AI
    base_url: https://api.edenai.run/v3
    data_location: Francja (UE); model wybierany u dostawcy z UE (sufiks @eu albo dostawca ovhcloud)
    note: Dostawca do oceny. Bramka API zgodna z OpenAI do modeli wielu dostawców, w tym otwartych modeli Mistral i OVHcloud.

  - code: ovhcloud
    name: OVHcloud AI Endpoints
    base_url: https://oai.endpoints.kepler.ai.cloud.ovh.net/v1
    data_location: Francja (UE)
    note: Dostawca do oceny. Otwarte modele, API zgodne z OpenAI.

  - code: google-gemini
    name: Google Gemini API (zgodność z OpenAI)
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    data_location: bez gwarancji przetwarzania w UE
    note: Tylko do prac deweloperskich na syntetycznych danych treningowych.
