# Ustawienia wydania konfiguracji. Pliki w config/seed/ są jedynym źródłem konfiguracji;
# do silnika trafiają jako engine/config/release.json (build-release albo backend: manage.py publish).
version: "2026.11.22-dev.7"

settings:
  # Wynik dla dokumentu spoza obsługiwanych typów (README: "pusty plik .json").
  unsupported_output: "{}"
  # Profil oceny: Qwen3.5-9B przez endpoint UE Eden AI (dostawca FlexAI).
  default_llm_profile: eden-qwen3.5-9b
  llm_concurrency: 4
  # Budżet czasu partii (40 min z zapasem do limitu 45 min organizatora na 150 PDF-ów).
  batch_time_budget_s: 2400
  # Tylko PDF-y cyfrowe: wstępna klasyfikacja z warstwy tekstowej 2 pierwszych stron, przed Doclingiem. Dokument,
  # któremu do progu każdego rodzaju brakuje co najmniej 1 punktu, dostaje {} bez konwersji (długie negatywy:
  # 11–30 s -> kilka ms). Na 226 PDF-ach organizatora: 13 z 13 cyfrowych negatywów odrzuconych, 180 z 180
  # cyfrowych dokumentów spraw idzie pełną ścieżką (najmniejszy zapas negatywu do progu: 1,5 pkt).
  preclassify_pages: 2
  preclassify_margin: 1.0
  # Tylko skany: wartość z LLM może się różnić od tekstu OCR polskimi znakami, spacjami i pomyłkami 0/o, 1/l/i,
  # ale musi wystąpić w tekście w całości. Na 30 skanach organizatora F1 0,926 -> 0,935, bez nowych błędnych trafień.
  ocr_tolerant_grounding: true
  # Tylko skany: przywraca polskie znaki zgubione przez OCR ("odwolania" -> "odwołania") słownikiem SJP
  # (engine/odwolania2json/data) i pisownią z tego samego dokumentu, zanim tekst trafi do reguł i LLM.
  # Na 30 skanach organizatora F1 0,930 -> 0,942 (docs/raport-jakosci.md).
  ocr_restore_diacritics: true

conversion_profiles:
  - id: default
    ocr_engine: rapidocr
    ocr_lang: [pl]
    ocr_mode: default
    scanned_ocr_mode: full_page
    replace_broken_text_layer: true
    table_structure: true
    max_pages: 6
    num_threads: 4
    document_timeout_s: 180
    # Skany: nagłówek „Odwołujący: | dane” w dwóch kolumnach układany jako etykieta, jej wartości (layout.py).
    scanned_label_columns: true
    # Skany: OCR tylko 3 pierwszych stron (cyfrowe PDF-y dalej do max_pages). Wartości pól są prawie zawsze
    # na stronach 1–2; na 30 skanach F1 bez zmian, konwersja długiego skanu ok. 2× krótsza.
    scanned_max_pages: 3
    # Skany: piksele jaśniejsze niż 155 w zapasowym przebiegu dla stron z ciężkim prześwitem z odwrotu kartki.
    scanned_bleed_cutoff: 155

llm_profiles:
  # Eden AI (bramka API, Eden AI SAS, Francja) do otwartych modeli z przetwarzaniem w UE. Endpoint UE
  # (api.eu.edenai.run) gwarantuje umownie, że treść zapytań nie trafia do infrastruktury poza UE
  # (DPA Eden AI, §12.2); bez dostawcy z UE wywołanie kończy się błędem. Nagłówek x-edenai-metadata
  # sprawia, że ślad ekstrakcji zapisuje dostawcę i region każdego wywołania. Klucz: EDEN_AI_API_KEY.
  # Porównanie modeli: docs/llm.md.
  - id: eden-qwen3.5-9b
    base_url: https://api.eu.edenai.run/v3
    extra_headers: {x-edenai-metadata: enabled}
    # FlexAI podaje Qwen3.5-9B bez fazy rozumowania (krótkie, szybkie odpowiedzi); region 'eu' potwierdzają metadane odpowiedzi.
    model: flexai/Qwen3.5-9B
    api_key_env: EDEN_AI_API_KEY
    temperature: 0
    max_tokens: 2048
    seed: 42
    timeout_s: 120
    max_retries: 3
    structured_output: json_schema

  - id: eden-ministral-8b
    base_url: https://api.eu.edenai.run/v3
    extra_headers: {x-edenai-metadata: enabled}
    model: mistral/ministral-8b-2512
    api_key_env: EDEN_AI_API_KEY
    temperature: 0
    max_tokens: 2048
    seed: 42
    timeout_s: 120
    max_retries: 3
    structured_output: json_schema

  - id: eden-ministral-3b
    base_url: https://api.eu.edenai.run/v3
    extra_headers: {x-edenai-metadata: enabled}
    model: mistral/ministral-3b-2512
    api_key_env: EDEN_AI_API_KEY
    temperature: 0
    max_tokens: 2048
    seed: 42
    timeout_s: 120
    max_retries: 3
    structured_output: json_schema
